<!doctype html>
<html><head><meta charset="utf-8"><title>L1 sample</title>
<style>
/*@sitefonts*/
:root{--navy:#0a2540;--sand:#f5f0e8;--line:#e8e0d0;--coral:#e07a5f;--coral-dark:#c45d42;--gold:#d4a853;--text:#2c3e50;--soft:#5a6c7d}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--sand)}
body{font-family:"Source Sans 3";color:var(--text);position:relative}
.abs{position:absolute}
.display{font-family:"Playfair Display"}
#contours{left:0;top:0}
#contours path{fill:none;stroke:var(--navy);stroke-opacity:.055;stroke-width:1.5;stroke-dasharray:1;stroke-dashoffset:1}
#logo{left:64px;top:44px;font:600 36px "Playfair Display";color:var(--navy)}
#logo i{display:block;width:64px;height:3px;background:var(--gold);margin-top:6px}
#url{right:64px;bottom:44px;font:600 25px "Source Sans 3";letter-spacing:.5px;color:var(--soft)}
#title{left:0;top:330px;width:1920px;text-align:center;transform-origin:50% 0}
.kicker{font:600 24px "Source Sans 3";letter-spacing:6px;color:var(--coral-dark);display:flex;gap:26px;justify-content:center;align-items:center}
.kicker b{display:block;width:90px;height:2px;background:var(--gold)}
#t1{font:600 104px/1.16 "Playfair Display";color:var(--navy);margin-top:22px}
#t2{font:italic 500 112px/1.1 "Cormorant Garamond";color:var(--coral-dark)}
.card{width:420px;height:480px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 18px 44px rgba(10,37,64,.13)}
.card .ph{position:relative;height:270px;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:16px;top:16px;background:var(--coral);color:#fff;font:600 16px "Source Sans 3";letter-spacing:.8px;padding:6px 14px;border-radius:6px}
.card .bd{padding:20px 24px}
.price{font:700 38px "Playfair Display";color:var(--navy)}
.name{font:600 25px "Playfair Display";color:var(--navy);margin-top:2px;white-space:nowrap}
.loc{font-size:20px;color:var(--soft);margin-top:4px}
.spec{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:13px;padding-top:12px;font-size:20px}
.spec em{font-style:normal;color:var(--coral-dark);font-size:26px;line-height:22px}
#ring{left:750px;top:350px;width:420px;height:480px;border:4px solid var(--coral-dark);border-radius:18px;opacity:0}
#main{left:750px;top:340px;width:420px;height:270px;border-radius:18px 18px 0 0;overflow:hidden;visibility:hidden;box-shadow:0 24px 60px rgba(10,37,64,.18)}
#main img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb{top:770px;width:160px;height:130px;border-radius:12px;overflow:hidden;box-shadow:0 8px 20px rgba(10,37,64,.14)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
#thumbring{left:80px;top:770px;width:160px;height:130px;border:4px solid var(--coral-dark);border-radius:12px}
#info{left:1020px;top:185px;width:820px}
#info .h{font:600 66px/1.15 "Playfair Display";color:var(--navy)}
#info .l{font-size:29px;color:var(--soft);margin-top:8px}
#info .p{font:700 76px "Playfair Display";color:var(--navy);margin-top:22px}
#info .m{font-size:29px;color:var(--text);margin-top:2px}
#info .r{width:100%;height:1px;background:var(--line);margin:40px 0 18px;transform-origin:0 50%}
.check{display:flex;align-items:center;gap:20px;font:600 38px "Source Sans 3";color:var(--navy);margin-top:34px}
.check svg{flex:none}
.check circle{fill:none;stroke:var(--gold);stroke-width:3.5;stroke-dasharray:1;stroke-dashoffset:1}
.check polyline{fill:none;stroke:var(--gold);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
#end{left:0;top:230px;width:1920px;text-align:center}
#site{font:600 148px "Playfair Display";color:var(--navy);margin-top:14px}
#erule{width:90px;height:3px;background:var(--gold);margin:14px auto 22px}
#phone{font:600 46px "Source Sans 3";color:var(--navy)}
#cursor{left:0;top:0;width:44px;height:52px;filter:drop-shadow(0 5px 7px rgba(10,37,64,.35));transform-origin:0 0}
#ripple{left:-40px;top:-40px;width:80px;height:80px;border:4px solid var(--coral-dark);border-radius:50%;opacity:0}
</style></head><body>
<svg id="contours" class="abs" width="1920" height="1080"></svg>
<div id="row"></div>
<div id="ring" class="abs"></div>
<div id="main" class="abs"></div>
<div id="thumbs"></div>
<div id="thumbring" class="abs"></div>
<div id="info" class="abs">
  <div class="h">The Mill at Zion's Hill</div>
  <div class="l">Zion's Hill, Saba</div>
  <div class="p">$775,000</div>
  <div class="m">1 Bed · 1 Bath · 0.42 Acres</div>
  <div class="r"></div>
  <div id="checks"></div>
</div>
<div id="title" class="abs">
  <div id="kick" class="kicker"><b></b>ZION'S HILL · SABA<b></b></div>
  <div id="t1">The only windmill home</div>
  <div id="t2">on Saba.</div>
</div>
<div id="end" class="abs">
  <div id="ek" class="kicker"><b></b>FIND YOUR PLACE AT<b></b></div>
  <div id="site">sabanrealty.com</div>
  <div id="erule"></div>
  <div id="phone">+599 416 5497</div>
</div>
<div id="endcards"></div>
<div id="logo" class="abs">Saban Realty<i></i></div>
<div id="url" class="abs">sabanrealty.com</div>
<div id="ripple" class="abs"></div>
<svg id="cursor" class="abs" viewBox="0 0 22 26"><path d="M2 1.5 L2 21 L7.2 16.4 L10.8 24.4 L14.4 22.8 L10.9 15 L18 14.6 Z" fill="#0a2540" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>
<script>
/*@gsap*/
/*@timeline*/
const FPS = TL.fps, B = 60 / TL.bpm, at = k => TL.at[k] * B;
const DURATION = TL.shots.reduce((s, x) => s + x.beats, 0) * B;
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const src = p => '../../assets/' + encodeURI(p).replace(/#/g, '%23');
const card = c => `<div class="ph"><img src="${src(c.img)}"><span class="badge">FOR SALE</span></div><div class="bd"><div class="price">${c.price}</div><div class="name">${c.name}</div><div class="loc">${c.loc}</div><div class="spec"><span>${c.spec}</span><em>→</em></div></div>`;

// Topographic lines: seeded sine wobble, same on every render.
const CX = 1500, CY = 620;
$('#contours').innerHTML = Array.from({ length: 15 }, (_, k) => {
  let d = '';
  for (let i = 0; i <= 120; i++) {
    const a = i / 120 * 2 * Math.PI, r = 130 + k * 92 + 26 * Math.sin(3 * a + k * .35) + 16 * Math.sin(5 * a - k * .6) + 9 * Math.sin(8 * a + k);
    d += (i ? 'L' : 'M') + (CX + 1.25 * r * Math.cos(a)).toFixed(1) + ' ' + (CY + r * Math.sin(a)).toFixed(1);
  }
  return `<path pathLength="1" d="${d}Z"/>`;
}).join('');

const MILL = 2, CARD_W = 420, STEP = 448, ROW_TOP = 350;
TL.cards.forEach((c, i) => {
  const el = document.createElement('div');
  el.className = 'card abs rowcard';
  el.style.cssText = `left:${750 + (i - MILL) * STEP}px;top:${ROW_TOP}px`;
  el.innerHTML = card(c);
  $('#row').append(el);
});
TL.gallery.forEach((g, i) => {
  $('#main').insertAdjacentHTML('beforeend', `<img src="${src(g.img)}" style="object-position:${g.pos};z-index:${i}">`);
  const t = document.createElement('div');
  t.className = 'thumb abs';
  t.style.left = 80 + i * 175 + 'px';
  t.innerHTML = `<img src="${src(g.img)}" style="object-position:${g.pos}">`;
  $('#thumbs').append(t);
});
$('#checks').innerHTML = TL.checks.map(c => `<div class="check"><svg width="54" height="54" viewBox="0 0 48 48"><circle pathLength="1" cx="24" cy="24" r="21" transform="rotate(-90 24 24)"/><polyline pathLength="1" points="14,25 21,32 34,17"/></svg><span>${c}</span></div>`).join('');
[[TL.cards[MILL], 150, -8, 800], [TL.cards[3], 1370, 7, 815]].forEach(([c, x, rot, top]) => {
  const el = document.createElement('div');
  el.className = 'card abs endcard';
  el.style.cssText = `left:${x}px;top:${top}px;rotate:${rot}deg`;
  el.innerHTML = card(c);
  $('#endcards').append(el);
});

const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });
const mains = $$('#main img'), rowcards = $$('.rowcard'), thumbs = $$('.thumb'), checks = $$('.check');

gsap.set(['#kick', '#t1', '#t2', '#info .h', '#info .l', '#info .p', '#info .m', '#ek', '#site', '#erule', '#phone', '#thumbring', '#cursor'], { opacity: 0 });
gsap.set(mains.slice(1), { clipPath: 'inset(0 0 0 100%)' });
gsap.set('#info .r', { scaleX: 0 });
gsap.set(thumbs, { opacity: 0, y: 40 });
gsap.set(rowcards, { x: i => 2200 + i * 150 });
gsap.set($$('.endcard'), { y: 460 });
gsap.set('#cursor', { x: 1560, y: 1120 });
gsap.set($$('.check span'), { opacity: 0, x: -18 });

// Opening: lines draw, the claim lands word block by word block.
tl.to('#contours path', { strokeDashoffset: 0, duration: 2.6, ease: 'power2.inOut', stagger: .03 }, 0);
const blur = (s, t, y = 26) => tl.fromTo(s, { opacity: 0, y, filter: 'blur(14px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: .7 }, t);
blur('#kick', at('title1') - .1, 12); blur('#t1', at('title1')); blur('#t2', at('title2'));

// The claim steps back and the listings slide in, slowing to rest on The Mill.
tl.to('#title', { y: -226, scale: .6, duration: .6, ease: 'power3.inOut' }, at('shrink'));
tl.to(rowcards, { x: 0, duration: 1.15, ease: 'power4.out', stagger: .05 }, at('row'));

// The cursor finds The Mill and clicks it.
tl.to('#cursor', { opacity: 1, duration: .25 }, at('cursorIn'));
tl.to('#cursor', { x: 1010, y: 640, duration: 1.05, ease: 'power2.inOut' }, at('cursorIn'));
const mill = rowcards[MILL];
tl.to([mill, '#ring'], { y: -10, duration: .3 }, at('hover'));
tl.to('#ring', { opacity: 1, duration: .25 }, at('hover'));
const click = (x, y, t) => {
  tl.to('#cursor', { scale: .82, duration: .08, ease: 'power1.in' }, t - .08).to('#cursor', { scale: 1, duration: .16 }, t);
  tl.set('#ripple', { x, y, scale: .2, opacity: 1 }, t);
  tl.to('#ripple', { scale: 1.3, opacity: 0, duration: .5 }, t);
};
click(1010, 640, at('click'));

// The card's own photo grows into the gallery. Everything else clears the way.
const t5 = at('click');
tl.set('#main', { visibility: 'visible' }, t5);
tl.to(rowcards.filter((_, i) => i !== MILL), { x: i => i < MILL ? -900 : 900, opacity: 0, duration: .55, ease: 'power3.in' }, t5);
tl.to('#title', { opacity: 0, y: -280, duration: .35, ease: 'power2.in' }, t5);
tl.to('#ring', { opacity: 0, duration: .15 }, t5);
tl.to(mill, { opacity: 0, duration: .2 }, t5 + .05);
tl.to('#main', { left: 80, top: 130, width: 860, height: 620, borderRadius: 18, duration: .85, ease: 'power3.inOut' }, t5);
tl.to(thumbs, { opacity: 1, y: 0, duration: .5, stagger: .06 }, t5 + .55);
tl.to('#thumbring', { opacity: 1, duration: .3 }, t5 + .95);
tl.to(['#info .h', '#info .l', '#info .p', '#info .m'].map($), { opacity: 1, duration: .55, stagger: .09 }, at('info'));
tl.fromTo(['#info .h', '#info .l', '#info .p', '#info .m'].map($), { y: 26 }, { y: 0, duration: .55, stagger: .09, immediateRender: false }, at('info'));
tl.to('#info .r', { scaleX: 1, duration: .6, ease: 'power2.inOut' }, at('info') + .35);
tl.to(mains[0], { scale: 1.05, duration: at('thumb2') - t5 + .7, ease: 'none' }, t5);

// Each feature arrives with the photo that proves it.
const tick = (i, t) => {
  const c = checks[i];
  tl.to(c.querySelector('circle'), { strokeDashoffset: 0, duration: .32, ease: 'power2.inOut' }, t);
  tl.to(c.querySelector('polyline'), { strokeDashoffset: 0, duration: .22, ease: 'power2.out' }, t + .2);
  tl.to(c.querySelector('span'), { opacity: 1, x: 0, duration: .4 }, t + .08);
};
tick(0, at('check1'));
tl.to('#cursor', { x: 335, y: 835, duration: at('thumb2') - at('info') - .15, ease: 'power2.inOut' }, at('info') + .15);
[['thumb2', 1, 335], ['thumb3', 2, 510]].forEach(([k, i, x]) => {
  const t = at(k);
  click(x, 835, t);
  tl.to('#thumbring', { left: 80 + i * 175, duration: .35, ease: 'power3.inOut' }, t);
  tl.to(mains[i], { clipPath: 'inset(0 0 0 0%)', duration: .65, ease: 'power3.inOut' }, t);
  tl.fromTo(mains[i], { scale: 1.1 }, { scale: 1, duration: 1.8, ease: 'power1.out', immediateRender: false }, t);
  tick(i, t);
});
tl.to('#cursor', { x: 510, y: 835, duration: .6, ease: 'power2.inOut' }, at('thumb3') - .7);
tl.to('#cursor', { x: 510, y: 1130, duration: .9, ease: 'power2.in' }, at('thumb3') + .55);

// Close: gallery clears, the address lands and two listings tilt up from below, then everything holds.
const t0 = at('out');
tl.to(['#main', '#thumbs', '#thumbring'], { opacity: 0, y: 30, duration: .3, ease: 'power2.in' }, t0);
tl.to('#info', { opacity: 0, y: 30, duration: .3, ease: 'power2.in' }, t0);
tl.to('#url', { opacity: 0, duration: .25 }, t0);
const t1 = at('site');
blur('#ek', t1 - .05, 12);
blur('#site', t1);
tl.to('#erule', { opacity: 1, duration: .4 }, t1 + .3);
blur('#phone', t1 + .3, 14);
tl.to($$('.endcard'), { y: 0, duration: .85, ease: 'power4.out', stagger: .07 }, t1 + .1);
tl.to({}, { duration: .001 }, DURATION - .001);

function renderFrame(t) { tl.time(t, false); }
const FONTS = ['600 36px "Playfair Display"', '700 38px "Playfair Display"', 'italic 500 112px "Cormorant Garamond"', '400 20px "Source Sans 3"', '600 35px "Source Sans 3"'];
window.READY = (async () => {
  await Promise.all(FONTS.map(f => document.fonts.load(f, 'Saban')));
  for (const f of FONTS) if (!document.fonts.check(f)) throw new Error('font missing: ' + f);
  await Promise.all($$('img').map(i => i.decode()));
  renderFrame(0);
})();
</script></body></html>
