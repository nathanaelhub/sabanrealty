# Emails Nathanael (by opening an issue that mentions him) before the admin page's GitHub token expires.
# The Cloudflare Worker (scripts/admin-worker) checks the token once a day and sends this event
# 14, 7, 3 and 1 days before the expiry date.
name: Admin token reminder

on:
  repository_dispatch:
    types: [admin-token-expiring]

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the reminder issue
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ github.event.client_payload.days_left }}
          EXPIRES: ${{ github.event.client_payload.expires }}
        run: |
          case "$DAYS" in ''|*[!0-9]*) echo "bad days_left"; exit 1;; esac
          case "$EXPIRES" in [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) echo "bad expires"; exit 1;; esac
          TITLE="Admin page: GitHub token expires $EXPIRES"
          BODY="@nathanaelhub The token the admin page uses to publish expires in $DAYS day(s), on $EXPIRES. After that, nothing published from sabanrealty.com/admin/ will go live.

          To renew: GitHub → Settings → Developer settings → Fine-grained tokens → regenerate the admin token (this repo only; Contents read/write, Actions read), then run \`npx wrangler secret put GITHUB_TOKEN\` in scripts/admin-worker. Close this issue when done."
          # Exact title match on the open list (issue search lags behind new issues).
          NUM=$(gh issue list -R "$GITHUB_REPOSITORY" --state open -L 100 --json number,title | jq -r --arg t "$TITLE" 'map(select(.title == $t))[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" -R "$GITHUB_REPOSITORY" --body "@nathanaelhub Reminder: $DAYS day(s) left (expires $EXPIRES)."
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
